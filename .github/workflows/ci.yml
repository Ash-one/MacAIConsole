name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo test --workspace

  console:
    name: MacAIConsole (swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: swift test
        run: |
          cd apps/MacAIConsole
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
            swift test --enable-xctest

  python-workers:
    name: Python workers (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # workers 的顶层导入是纯标准库；numpy 仅为覆盖函数内延迟导入的路径
      - run: python -m pip install --quiet pytest numpy

      - run: python -m pytest scripts/tests -v
