name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Phase 1B environment manager 的集成测试使用真实 uv；固定经过测试的版本。
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.21"
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo test --workspace

  console:
    name: MacAIConsole (swift test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: swift test
        run: |
          cd apps/MacAIConsole
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer \
            swift test --enable-xctest

  runner-packages:
    name: Runner package (${{ matrix.runner }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runner: [kokoro, qwen3-asr, qwen3-tts, sherpa-onnx, mlx-lm, llama.cpp, whisper.cpp]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.21"

      # Adapter 单测只依赖 pytest + numpy；真实 MLX/模型接线仍由 macOS smoke 验证。
      - run: python -m pip install --quiet pytest numpy

      - run: uv lock --check --project "runners/${{ matrix.runner }}"

      - name: Test Runner adapter
        env:
          PYTHONPATH: runners/${{ matrix.runner }}/src
        run: python -m pytest "runners/${{ matrix.runner }}/tests" -v
