[project]
name = "macai-kokoro-runner"
version = "0.1.0"
description = "Kokoro-82M-zh-MLX Runner 的受管 Python 环境（MacAI Runner 插件架构 Phase 2）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio==0.5.1",
    "misaki[zh]==0.9.4",
    "misaki[en]==0.9.4",
    "numpy>=2,<3",
    "phonemizer-fork==3.3.2",
    "espeakng-loader==0.2.4",
    "macai-kokoro-runner",
]

[tool.uv.sources]
macai-kokoro-runner = { path = "." , editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macai_kokoro_runner"]
