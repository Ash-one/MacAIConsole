schema = "macai.model.v1"
id = "kokoro-82m-zh"
name = "Kokoro 82M zh"
capabilities = ["tts.v1"]
runner = "org.macai.kokoro"
adapter = "kokoro-mlx"
format = "directory"

[source]
type = "huggingface"
repo = "1038lab/Kokoro-82M-zh-MLX"
# Phase 2 核对：本地 model.safetensors sha256 与该 revision 的 HF LFS oid 一致
revision = "4bd6c9644da381fee105f37fcd8cb63d038ba7e8"

[artifacts]
# artifacts.directory 是相对 Models root 的子目录名（safe relative path，不允许 "."）
directory = "kokoro-82m-zh"
files = ["config.json", "model.safetensors"]

[defaults]
keep_alive = "always"
voice = "zf_001"
format = "wav"

[resources]
memory_estimate_bytes = 400000000

[compatibility]
runner = ">=0.1,<0.2"
