schema = "macai.model.v1"
id = "Qwen3-TTS-0.6B-CustomVoice-4bit"
name = "Qwen3-TTS 0.6B CustomVoice 4bit"
capabilities = ["tts.v1"]
runner = "org.macai.qwen3-tts"
adapter = "qwen3-tts-customvoice"
format = "directory"

[source]
type = "huggingface"
repo = "mlx-community/Qwen3-TTS-12Hz-0.6B-CustomVoice-4bit"
# 2026-09-03 git ls-remote main HEAD（immutable 40-hex，经 HF API 核对）
revision = "08c72cad5e2fd0f41730c8bd1f28149585e46361"

[artifacts]
# artifacts.directory 是相对 Models root 的子目录名（safe relative path，不允许 "."）
directory = "Qwen3-TTS-0.6B-CustomVoice-4bit"
files = [
    "config.json",
    "generation_config.json",
    "merges.txt",
    "model.safetensors",
    "model.safetensors.index.json",
    "preprocessor_config.json",
    "speech_tokenizer/config.json",
    "speech_tokenizer/configuration.json",
    "speech_tokenizer/model.safetensors",
    "speech_tokenizer/preprocessor_config.json",
    "tokenizer_config.json",
    "vocab.json",
]

[defaults]
keep_alive = "always"
voice = "Vivian"

[resources]
memory_estimate_bytes = 1700000000

[compatibility]
runner = ">=0.1,<0.2"
