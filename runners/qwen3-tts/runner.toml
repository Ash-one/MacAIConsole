schema = "macai.runner.v1"
id = "org.macai.qwen3-tts"
version = "0.1.0"
protocols = ["macai.runner.v1"]
capabilities = ["tts.v1"]

[entrypoint]
command = ["{environment.python}", "-m", "macai_qwen3_tts_runner"]
working_directory = "package"

[runtime]
type = "python-uv"
id = "org.macai.qwen3-tts-python"
project = "."
lock = "uv.lock"
python = ">=3.12,<3.13"
# probe argv 与 entrypoint 同受 shell 元字符校验（禁 `;`），用纯 import 表达式。
probe = ["{environment.python}", "-c", "import mlx_audio, numpy"]

[capacity]
max_instances = 1
max_concurrency_per_instance = 1

[timeouts]
boot_seconds = 30
load_seconds = 600
inference_seconds = 300
shutdown_seconds = 10

[security]
network_during_install = true
network_during_runtime = false
inherit_environment = ["HTTP_PROXY", "HTTPS_PROXY", "NO_PROXY"]

[[models]]
profile = "profiles/Qwen3-TTS-0.6B-CustomVoice-4bit.toml"
adapter = "qwen3-tts-customvoice"

[[local_detectors]]
id = "qwen3-tts-customvoice-mlx-directory"
capability = "tts.v1"
adapter = "qwen3-tts-customvoice"
required_files = ["config.json"]
required_directories = ["speech_tokenizer"]
required_globs = [{ pattern = "*.safetensors", min_matches = 1 }]
reason = "Qwen3-TTS CustomVoice MLX config, weights and speech tokenizer"

[[local_detectors.json_predicates]]
file = "config.json"
pointer = "/model_type"
equals = "qwen3_tts"

[[local_detectors.json_predicates]]
file = "config.json"
pointer = "/tts_model_type"
equals = "custom_voice"
