schema = "macai.model.v1"
id = "MiniCPM5-2B-MLX"
name = "MiniCPM5 2B MLX 4-bit"
capabilities = ["chat.v1"]
runner = "org.macai.mlx-lm"
adapter = "mlx-lm-chat"
format = "directory"

[source]
type = "huggingface"
repo = "openbmb/MiniCPM5-2B-MLX"
# 2026-09-08 git ls-remote main HEAD（immutable 40-hex，经 HF API 核对）
revision = "32f8dd5df1188512a20413f1297083238306634c"

[artifacts]
# artifacts.directory 是相对 Models root 的子目录名（safe relative path，不允许 "."）
directory = "MiniCPM5-2B-MLX"
files = [
    "chat_template.jinja",
    "config.json",
    "generation_config.json",
    "model.safetensors",
    "model.safetensors.index.json",
    "tokenizer.json",
    "tokenizer_config.json",
]

[defaults]
keep_alive = "5m"

[resources]
memory_estimate_bytes = 2500000000

[compatibility]
runner = ">=0.1,<0.2"
