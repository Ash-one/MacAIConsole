[project]
name = "macai-whisper-cpp-runner"
version = "0.1.0"
description = "MacAI persistent whisper.cpp STT Runner"
requires-python = ">=3.12,<3.13"
dependencies = ["macai-whisper-cpp-runner"]

[tool.uv.sources]
macai-whisper-cpp-runner = { path = ".", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macai_whisper_cpp_runner"]
