schema = "macai.model.v1"
id = "Qwen3-ASR-0.6B-MLX-4bit"
name = "Qwen3-ASR 0.6B MLX 4bit"
capabilities = ["stt.v1"]
runner = "org.macai.qwen3-asr"
adapter = "qwen3-asr-mlx"
format = "directory"

[source]
type = "huggingface"
repo = "aufklarer/Qwen3-ASR-0.6B-MLX-4bit"
# 2026-09-02 git ls-remote master HEAD（immutable 40-hex）
revision = "3478f178e267548f04a6b616ff10beeb1e644e54"

[artifacts]
# artifacts.directory 是相对 Models root 的子目录名（safe relative path，不允许 "."）
directory = "Qwen3-ASR-0.6B-MLX-4bit"
files = [
    "config.json",
    "configuration.json",
    "merges.txt",
    "model.safetensors",
    "model.safetensors.index.json",
    "tokenizer_config.json",
    "vocab.json",
]

[defaults]
keep_alive = "always"

[resources]
memory_estimate_bytes = 800000000

[compatibility]
runner = ">=0.1,<0.2"
