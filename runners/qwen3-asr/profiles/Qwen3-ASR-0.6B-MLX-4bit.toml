schema = "macai.model.v1"
id = "Qwen3-ASR-0.6B-MLX-4bit"
name = "Qwen3-ASR 0.6B MLX 4bit"
capabilities = ["stt.v1"]
runner = "org.macai.qwen3-asr"
adapter = "qwen3-asr-mlx"
format = "directory"

[source]
type = "huggingface"
repo = "mlx-community/Qwen3-ASR-0.6B-4bit"
# 2026-01-29 git ls-remote main HEAD（immutable 40-hex，经 HF API 核对）
revision = "313d850181767edf09f00a9c289becca70e58cd0"

[artifacts]
# artifacts.directory 是相对 Models root 的子目录名（safe relative path，不允许 "."）
directory = "Qwen3-ASR-0.6B-MLX-4bit"
files = [
    "chat_template.json",
    "config.json",
    "generation_config.json",
    "merges.txt",
    "model.safetensors",
    "model.safetensors.index.json",
    "preprocessor_config.json",
    "tokenizer_config.json",
    "vocab.json",
]


[defaults]
keep_alive = "always"

[resources]
memory_estimate_bytes = 800000000

[compatibility]
runner = ">=0.1,<0.2"
