[project]
name = "macai-qwen3-asr-runner"
version = "0.1.0"
description = "Qwen3-ASR-0.6B-MLX Runner 的受管 Python 环境（MacAI Runner 全面迁移）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio==0.5.1",
    "numpy>=2,<3",
    "macai-qwen3-asr-runner",
]

[tool.uv.sources]
macai-qwen3-asr-runner = { path = ".", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macai_qwen3_asr_runner"]
