[project]
name = "macai-llama-cpp-runner"
version = "0.1.0"
description = "llama.cpp Chat Runner 的受管 Python 环境（MacAI cpp 引擎 Runner 化）：JSONL 协议桥接 llama-server OpenAI API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "macai-llama-cpp-runner",
]

[tool.uv.sources]
macai-llama-cpp-runner = { path = ".", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macai_llama_cpp_runner"]
