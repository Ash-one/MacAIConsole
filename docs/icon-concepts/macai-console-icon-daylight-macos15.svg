<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F3F8FC"/>
      <stop offset="0.72" stop-color="#EAF4FA"/>
      <stop offset="1" stop-color="#F8F4EE"/>
    </linearGradient>
    <radialGradient id="core" cx="34%" cy="25%" r="80%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="0.58" stop-color="#F1F7FB" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#DCEAF2" stop-opacity="0.92"/>
    </radialGradient>
    <linearGradient id="circuit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18C9ED"/>
      <stop offset="0.52" stop-color="#168FFF"/>
      <stop offset="1" stop-color="#245BEA"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54E8F7"/>
      <stop offset="0.48" stop-color="#188FFF"/>
      <stop offset="1" stop-color="#3255DD"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#73ECF8"/>
      <stop offset="0.52" stop-color="#1FA7F5"/>
      <stop offset="1" stop-color="#365BDE"/>
    </linearGradient>
    <filter id="shellShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6C8798" flood-opacity="0.18"/>
    </filter>
    <filter id="coreShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="15" stdDeviation="18" flood-color="#6F91A4" flood-opacity="0.22"/>
    </filter>
    <filter id="circuitGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shellClip">
      <rect x="42" y="42" width="940" height="940" rx="218"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="none"/>
  <g transform="translate(54.468085 54.468085) scale(0.893617021277)">
  <g filter="url(#shellShadow)">
    <rect x="42" y="42" width="940" height="940" rx="218" fill="url(#shell)"/>
    <rect x="54" y="54" width="916" height="916" rx="206" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="5"/>
    <rect x="60" y="60" width="904" height="904" rx="200" fill="none" stroke="#B9CEDA" stroke-opacity="0.42" stroke-width="3"/>
  </g>

  <g clip-path="url(#shellClip)">
    <ellipse cx="304" cy="190" rx="420" ry="260" fill="#FFFFFF" opacity="0.52"/>
    <ellipse cx="870" cy="880" rx="360" ry="280" fill="#D9F1FA" opacity="0.28"/>

    <!-- Pale local runtime core -->
    <circle cx="385" cy="512" r="256" fill="url(#core)" stroke="#FFFFFF" stroke-width="10" filter="url(#coreShadow)"/>
    <circle cx="385" cy="512" r="245" fill="none" stroke="#A9C5D5" stroke-opacity="0.48" stroke-width="4"/>

    <!-- Subtle brand arc, secondary to the platform mark -->
    <path d="M385 267 A245 245 0 0 0 385 757" fill="none" stroke="url(#arc)" stroke-width="32" stroke-linecap="round" opacity="0.92"/>
    <path d="M385 267 A245 245 0 0 0 385 757" fill="none" stroke="#B8F5F8" stroke-width="9" stroke-linecap="round" opacity="0.9"/>

    <!-- Three independent orthogonal circuit traces; no shared segments -->
    <g fill="none" stroke="url(#circuit)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#circuitGlow)">
      <path d="M594 382 H675 Q697 382 697 360 V322 Q697 300 719 300 H804"/>
      <path d="M615 460 H724 Q746 460 746 482 V490 Q746 512 768 512 H804"/>
      <path d="M594 642 H675 Q697 642 697 664 V702 Q697 724 719 724 H804"/>
    </g>
    <g fill="none" stroke="#A8F4FA" stroke-opacity="0.76" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M594 382 H675 Q697 382 697 360 V322 Q697 300 719 300 H804"/>
      <path d="M615 460 H724 Q746 460 746 482 V490 Q746 512 768 512 H804"/>
      <path d="M594 642 H675 Q697 642 697 664 V702 Q697 724 719 724 H804"/>
    </g>

    <!-- Exactly three independent circuit contacts -->
    <g>
      <circle cx="854" cy="300" r="54" fill="#F7FCFF" stroke="#7EC9EF" stroke-width="9"/>
      <circle cx="854" cy="300" r="38" fill="url(#node)"/>
      <circle cx="842" cy="287" r="9" fill="#D4FBFF" opacity="0.7"/>

      <circle cx="854" cy="512" r="54" fill="#F7FCFF" stroke="#7EC9EF" stroke-width="9"/>
      <circle cx="854" cy="512" r="38" fill="url(#node)"/>
      <circle cx="842" cy="499" r="9" fill="#D4FBFF" opacity="0.7"/>

      <circle cx="854" cy="724" r="54" fill="#F7FCFF" stroke="#7EC9EF" stroke-width="9"/>
      <circle cx="854" cy="724" r="38" fill="url(#node)"/>
      <circle cx="842" cy="711" r="9" fill="#D4FBFF" opacity="0.7"/>
    </g>

    <!-- One flat graphite Apple platform mark -->
    <svg x="238" y="355" width="300" height="300" viewBox="0 0 24 24" aria-label="Apple">
      <path fill="#343A43" d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
    </svg>
  </g>
  </g>
</svg>
