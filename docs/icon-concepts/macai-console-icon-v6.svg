<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#222832"/>
      <stop offset="0.48" stop-color="#11151C"/>
      <stop offset="1" stop-color="#07090D"/>
    </linearGradient>
    <radialGradient id="core" cx="34%" cy="27%" r="78%">
      <stop offset="0" stop-color="#353D49"/>
      <stop offset="0.43" stop-color="#202630"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </radialGradient>
    <linearGradient id="blueArc" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#176BFF"/>
      <stop offset="0.55" stop-color="#0756E8"/>
      <stop offset="1" stop-color="#143BC7"/>
    </linearGradient>
    <linearGradient id="cyanArc" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6EF1FF"/>
      <stop offset="0.5" stop-color="#20C9F4"/>
      <stop offset="1" stop-color="#169CEB"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#52E8FF"/>
      <stop offset="0.42" stop-color="#1B9EFF"/>
      <stop offset="1" stop-color="#175BE8"/>
    </linearGradient>
    <filter id="shellShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="coreShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blueGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="shellClip">
      <rect x="40" y="40" width="944" height="944" rx="214"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="none"/>
  <g filter="url(#shellShadow)">
    <rect x="40" y="40" width="944" height="944" rx="214" fill="url(#shell)"/>
    <rect x="51" y="51" width="922" height="922" rx="203" fill="none" stroke="#667180" stroke-opacity="0.28" stroke-width="3"/>
  </g>

  <g clip-path="url(#shellClip)">
    <ellipse cx="316" cy="164" rx="408" ry="240" fill="#FFFFFF" opacity="0.035"/>

    <!-- One large, unmistakable graphite intelligence core -->
    <circle cx="430" cy="512" r="270" fill="#06080C" opacity="0.72" filter="url(#coreShadow)"/>
    <circle cx="430" cy="512" r="264" fill="url(#core)" stroke="#8290A1" stroke-opacity="0.52" stroke-width="14"/>
    <path d="M253 365 A264 264 0 0 1 582 278" fill="none" stroke="#AAB4C0" stroke-opacity="0.13" stroke-width="9" stroke-linecap="round"/>

    <!-- Exactly three thick, direct paths from core to endpoints -->
    <g fill="none" stroke="#1F8FFF" stroke-width="90" stroke-linecap="round">
      <path d="M658 367 L790 342"/>
      <path d="M694 512 L790 512"/>
      <path d="M658 657 L790 682"/>
    </g>
    <g fill="none" stroke="#8CEEFF" stroke-opacity="0.78" stroke-width="30" stroke-linecap="round">
      <path d="M658 367 L790 342"/>
      <path d="M694 512 L790 512"/>
      <path d="M658 657 L790 682"/>
    </g>

    <!-- Precisely three service nodes, no inter-node links -->
    <g>
      <circle cx="844" cy="332" r="70" fill="#091321" stroke="#1B5FCF" stroke-width="14"/>
      <circle cx="844" cy="332" r="52" fill="url(#node)"/>
      <circle cx="828" cy="316" r="12" fill="#B7F7FF" opacity="0.38"/>

      <circle cx="844" cy="512" r="70" fill="#091321" stroke="#1B5FCF" stroke-width="14"/>
      <circle cx="844" cy="512" r="52" fill="url(#node)"/>
      <circle cx="828" cy="496" r="12" fill="#B7F7FF" opacity="0.38"/>

      <circle cx="844" cy="692" r="70" fill="#091321" stroke="#1B5FCF" stroke-width="14"/>
      <circle cx="844" cy="692" r="52" fill="url(#node)"/>
      <circle cx="828" cy="676" r="12" fill="#B7F7FF" opacity="0.38"/>
    </g>

    <!-- Controlled dual-layer intersection arc -->
    <path d="M430 248 A264 264 0 0 0 430 776" fill="none" stroke="#0C43C9" stroke-opacity="0.42" stroke-width="120" stroke-linecap="round" filter="url(#blueGlow)"/>
    <path d="M430 248 A264 264 0 0 0 430 776" fill="none" stroke="url(#blueArc)" stroke-width="98" stroke-linecap="round"/>
    <path d="M430 248 A264 264 0 0 0 430 776" fill="none" stroke="url(#cyanArc)" stroke-width="38" stroke-linecap="round"/>
  </g>
</svg>
